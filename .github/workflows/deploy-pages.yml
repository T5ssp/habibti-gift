name: Publish Habibti to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Refresh portable gift and prepare static site
        run: |
          python3 tools/build_standalone.py
          mkdir -p .pages-site
          cp index.html .pages-site/index.html
          cp -R assets .pages-site/assets
          touch .pages-site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
